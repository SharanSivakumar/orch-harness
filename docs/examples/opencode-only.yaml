# One CLI, one API key. Every row runs in OpenCode.
# Merge these keys into your instance's orch.yaml; the rest stays as generated.
#
# OpenCode always runs its own configured default model. The `models` block
# below is therefore an example of what NOT to expect: model pins are ignored
# for the opencode executor (see README, "Tiers and models").
executors:
  default: "opencode"
  allowed: [opencode, manual, mock]
  flavors:
    opencode: hard              # full-autonomy work orders instead of the junior default
  arg_kick: [opencode]          # the launch prompt is passed as an argument, not pasted
  unblock_executor: "opencode"
  auto_unblock: [opencode]      # explicit, because opencode is hard-flavored here
  retier_on_max_unblock: "opencode"
  max_unblock_attempts: 2

review:
  policy: none                  # one model cannot independently review itself

scheduler:
  mode: dag
  max_parallel: 6
  min_free_mb: 2048
